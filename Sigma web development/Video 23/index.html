<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property
    </title>
    <style>
        * {
            margin: 0;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            color: rgb(187, 17, 17);
        }

        .box {
            background-color: lightblue;
            border: 2px solid blue;
            /* display : none; */
            width: 200px;
            padding: 20px;
            margin: 20px;
        }
        .box1 {
            background-color: lightgreen;
            border: 2px solid green;
            display: inline-block;
            width: 200px;
            padding: 20px;
            margin: 20px;
            justify-content: center;
            /* visibility: hidden; */
        }
    </style>
</head>

<body>
    <div class="box">
        This is a box.
    </div>
    <span class="box1">
        I am a good boy
    </span>
</body> 

</html>

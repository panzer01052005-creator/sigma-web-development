<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 133px;
            width: 80px;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        #box1 {
            background-color: red;
            position: relative;
            z-index: 2;
        }

        #box2 {
            background-color: blue;
            position: relative;
            top: 34px;
            bottom: 56px;
            left: 34px;
        }

        #box3 {
            background-color: green;
            position:fixed;
            top: 34px;
            
        }

        #box4 {
            background-color: yellow;
        }

        .parent {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            margin: 34px;
            padding: 34px;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>
</body>

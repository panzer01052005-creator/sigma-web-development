<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: rgb(27, 182, 234);
            border: 2px solid blue;
            box-shadow: 5px 5px 5px rgb(6, 135, 190);
            border-radius: 5px;
        }
        .p{
            text-shadow: 2px 2px 2px rgb(21, 157, 215);
        }
        
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div> 
    <p class="p">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Aliquam, culpa?</p>
</body>
</html>

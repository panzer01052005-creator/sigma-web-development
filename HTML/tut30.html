<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .box{
            font-size: 72px;
            text-align: center;
            background-color: red;
            color: whitesmoke;
            display: none;
        }
        @media (max-width: 300px){
            #box-1{
                display: block;
                background-color: blueviolet;
            }
        }


        @media (max-width: 500px) and (min-width:300px){
            #box-2{
                display: block;
                background-color: aqua;
            }
        }


        @media (max-width: 800px) and (min-width:500px){
            #box-3{
                display: block;
                background-color: rgb(240, 157, 22);
            }
        }


        @media (min-width: 800px){
            #box-4{
                display: block;
                background-color:rgb(27, 27, 24);
            }
        }
    </style>
</head>
<body>
    <div class="box" id="box-1">Mai ek Iphone hoon</div>
    <div class="box" id="box-2">Mai ek tablet hoon</div>
    <div class="box" id="box-3">Mai ek desktop  computer hoon</div>
    <div class="box" id="box-4"> Mai ek widescreen computer hoon</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .navbar{
            background-color: lightblue;
            border-radius: 4px;
        }
        .navbar ul{
            overflow: auto;
        }
        .navbar li{
            float:left;
            list-style: none;
            padding:3px 3px;
            margin: 13px 20px;
        }
        .navbar li a{
            padding:3px;
            text-decoration: none;
            color: whitesmoke;
        }
        .navbar li a:hover{
            color:black;
            background-color: rgb(122, 190, 212);
        }
        .search{
            float:right;
            color: rgb(194, 142, 142);
            padding: 12px 75px;
        }
        .navbar input{
            border:2px solid black;
            border-radius: 14px;
            padding: 3px 17px;
            width:130px;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact us</a></li>
            <div class="search">
                <input type="text" name="search" id="search" placeholder="Search this website">
            </div>
            </ul>
        </nav>
    </header>
</body>
</html>

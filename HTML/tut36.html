<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and Animation</title>
    <style>
        .container {
            background-color: aquamarine;
        }

        .box {
            background-color: bisque;
            width: 250px;
            height: 250px;
            position: relative;
            animation-name: abhishek1;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            /* animation-fill-mode: alternate; */
            /* animation-timing-function: ease-in-out; */
            /* animation-delay: 3s; */
            /* animation-direction: reverse; */
            /* animation: animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode */
            animation: abhishek1 4s ease-in-out 2s 12 backwards;
        }

        #box1 {
            animation-name: abhishek2;
            animation-iteration-count: infinite;
        }

        @keyframes abhishek2 {
            0% {
                top: 0px;
                left: 0px
            }

            25% {
                top: 250px;
                left: 0px;
            }

            50% {
                top: 250px;
                left: 250px;
            }

            75% {
                top: 0px;
                left: 250px;
            }

            100% {
                top: 0px;
                left: 0px;
            }
        }

        @keyframes abhishek1 {
            from {
                width: 200px;
            }

            to {
                width: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            This is a box.
        </div>
    </div>
    <div class="container">
        <div class="box" id="box1">
            This is another box.
        </div>
    </div>
</body>

</html>

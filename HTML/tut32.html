<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and nth child selectors</title>
    <style>
        .container {
            margin: 34px 23px;
            display: block;
            width: 233px;
            margin: auto;
        }

        input {
            display: block;
        }

        input[type='text'] {
            padding: 23px;
            border: 2px solid red;
        }

        a[target] {
            font-size: 44px;
            color: aquamarine;
        }

        a[target="_self"] {
            font-size: 44px;
            color: rgb(107, 102, 176);
        }

        input[type="email"] {
            font-size: 14px;
            color: bisque;
            border: 4px solid rebeccapurple;

        }

        /* this will apply CSS for third child */
        /* li:nth-child(3){
            color: brown;
        } */

        /* Odd child  */
        /* li:nth-child(odd){
            color: brown;
        }
         */

        /* Even child  */
        li:nth-child(even) {
            color: brown;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><a href="http://google.com" target="_blank"> Go to google</a></h1>
        <h1><a href="http://facebook.com" target="_self"> Go to facebook</a></h1>
        <form action="" class="form-control">
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your Email">
            <input type="password" placeholder="Enter your password">
            <input type="submit" value="submit">
        </form>
        <ul>
            <li class="item" id="item-1">Item 1</li>
            <li class="item" id="item-2">Item 2</li>
            <li class="item" id="item-3">Item 3</li>
            <li class="item" id="item-4">Item 4</li>
            <li class="item" id="item-5">Item 5</li>
        </ul>
    </div>
</body>

</html>

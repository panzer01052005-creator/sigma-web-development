<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility anb z-index</title>
    <style>
        .box{
            width: 170px;
            height:170px ;
            border: 2px solid black;

        }
        #box1{
            position: relative;
            top:49px ;
            z-index: 34;
            background-color: blanchedalmond;
        }
        #box2{
            position: relative;
            top: 14px;
            /* z-index: will work only for position relative, absolute, fixed or sticky; */

            /* visibility: hidden; will hide the element but will show its empty space */

            /* display: none;  will hide the element and the space */
            background-color: rgb(29, 146, 219);
        }
        #box3{
            background-color: rgb(92, 219, 100);
        }
        #box4{
            background-color: rgb(219, 77, 202);
        }
    </style>
</head>
<body>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
</body>
</html>
